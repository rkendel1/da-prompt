name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Headless factory run (offline agents)
        run: FACTORY_OFFLINE_DELAY_MS=0 FACTORY_DATA_DIR=$RUNNER_TEMP/data node src/cli.js "A habit tracker with daily check-ins"
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t da-prompt .
