  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 29 9.5v13L16 30 3 22.5v-13z" fill="#e8ebf1"/><path d="M16 2 29 9.5 16 17 3 9.5z" fill="#9aa5ff"/><path d="M16 17v13l13-7.5v-13z" fill="#5b5bf0"/></svg>
        <span>
          <strong>da-prompt</strong>
          <small>software factory</small>
        </span>
      </a>
      <a class="new-run" href="#/">+ New run</a>
      <nav class="sidenav" aria-label="Operations">
        <p class="side-label">Work</p>
        <a class="side-link" href="#/backlog"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span>Backlog</span></a>
        <a class="side-link" href="#/chat"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span>Chat</span></a>
        <a class="side-link" href="#/projects"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Projects</span></a>
        <a class="side-link" href="#/history"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 8v4l3 2"/></svg><span>History</span></a>
        <p class="side-label">Operate</p>
        <a class="side-link" href="#/terminal"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-5-6-5M12 19h8"/></svg><span>Terminal</span></a>
        <a class="side-link" href="#/setup"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span class="hdot" id="health-dot" aria-hidden="true"></span><span>System health</span></a>
        <a class="side-link" href="#/pax"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/></svg><span>Evidence (PAX)</span></a>
        <p class="side-label">Configure</p>
        <a class="side-link" href="#/settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Settings</span></a>
        <a class="side-link" href="#/providers"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="6" rx="1.5"/><rect x="4" y="14" width="16" height="6" rx="1.5"/><path d="M8 7h.01M8 17h.01"/></svg><span>Models &amp; keys</span></a>
        <a class="side-link" href="#/prompt"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h6"/></svg><span>Operating prompt</span></a>
      </nav>
      <p class="side-label runs-label">Recent runs</p>
      <nav class="runs" id="runs" aria-label="Runs"></nav>
    </aside>

    <main class="main" id="main" tabindex="-1"></main>
    <div id="backend-banner" class="banner" role="alert" hidden>The da-prompt backend is not responding. Nothing on this page is changing; it will reconnect automatically.</div>
  </div>

  <template id="tpl-new">
    <section class="page new">
      <p class="eyebrow">research note · software factory · 7 layers</p>
      <h1>Turn an idea into a working app.</h1>
      <p class="lede">The factory plans a task graph, spins up specialized agents, runs them in parallel, verifies every step, fixes what fails, deploys, and hands you the code.</p>

      <div id="setup-banner" class="card callout fail" role="status" hidden></div>
      <div class="new-grid">
        <form id="new-form" class="card prompt-card" autocomplete="off">
          <div class="tag">&lt;project&gt;</div>
          <fieldset class="project" id="project">
            <legend class="sr-only">Project</legend>
            <div class="seg" role="radiogroup" aria-label="Project source">
              <label><input type="radio" name="sourceMode" value="new" checked><span>New project</span></label>
              <label><input type="radio" name="sourceMode" value="registered"><span>Registered project</span></label>
              <label><input type="radio" name="sourceMode" value="local"><span>Local directory</span></label>
              <label><input type="radio" name="sourceMode" value="github"><span>GitHub repository</span></label>
            </div>
            <div class="src" id="src-registered" hidden>
              <label class="field"><span>Project <em>from <a href="#/projects">Projects</a> — registered once, remembered</em></span><select name="projectId" id="project-id"></select></label>
              <label class="field"><span>Isolation</span><select name="regWorkingMode" id="reg-working-mode"></select></label>
              <label class="field check" id="reg-publish-field" hidden><input name="regPublish" id="reg-publish" type="checkbox"> <span>Push the run branch and open a pull request when finished</span></label>
            </div>
            <div class="src" id="src-local" hidden>
              <label class="field"><span>Directory <em>chosen from the server's authorized folders</em></span><select name="directoryId" id="directory-id"></select></label>
              <div class="actions" id="browse-row" hidden><button class="btn" type="button" id="browse-dir">Browse for a folder…</button><span class="hint">Pick any folder on the machine running da-prompt.</span></div>
              <label class="field"><span>Isolation</span><select name="workingMode" id="working-mode"></select></label>
            </div>
            <div class="src" id="src-github" hidden>
              <label class="field"><span>Repository</span><input name="sourceRepo" id="repo-url" placeholder="owner/repo  or  https://github.com/owner/repo"></label>
              <label class="field"><span>Branch, tag or commit <em>optional, default branch if empty</em></span><input name="ref" id="repo-ref" list="repo-branches" placeholder="main"><datalist id="repo-branches"></datalist></label>
              <div class="actions"><button class="btn" type="button" id="check-repo">Check repository</button></div>
              <label class="field check"><input name="publish" id="publish" type="checkbox"> <span>Push the run branch and open a pull request when finished</span></label>
            </div>
            <label class="field check" id="auto-apply-field" hidden><input name="autoApply" type="checkbox"> <span>Apply to my directory automatically when the run is verified and ready <em>conflict-checked; nothing is staged or committed</em></span></label>
            <label class="field check" id="install-field" hidden><input name="allowInstall" type="checkbox"> <span>Install dependencies <em>installs what the project needs in the isolated workspace before the baseline, and lets agents install more; runs the project's own install scripts</em></span></label>
            <div class="srcsummary" id="src-summary" aria-live="polite" hidden></div>
          </fieldset>
          <div class="tag">&lt;/project&gt;</div>

          <div class="tag">&lt;inputs&gt;</div>
          <label class="field">
            <span id="idea-label">Idea <em>required</em></span>
            <textarea name="idea" rows="3" required maxlength="4000" placeholder="A shared reading list for book clubs…"></textarea>
          </label>
          <div class="examples" id="examples" aria-label="Example ideas"></div>
          <label class="field"><span>Requirements</span><textarea name="requirements" rows="2" placeholder="Members add books, vote on the next pick, mark books as read"></textarea></label>
          <label class="field"><span>Stack / constraints</span><input name="stack" placeholder="Node.js ≥ 20, minimal dependencies"></label>
          <label class="field"><span>Budget / limits</span><input name="limits" placeholder="Solid v1 in one run"></label>
          <label class="field"><span>Access / keys</span><input name="tools" placeholder="Describe access; put real secrets in the server environment"></label>
          <div class="tag">&lt;/inputs&gt;</div>

          <div class="tag">&lt;model&gt;</div>
          <div id="model-picker" class="model-picker"></div>
          <div class="tag">&lt;/model&gt;</div>

          <fieldset class="stack-opt appspec" id="stack-opt">
            <legend>Application <em id="appspec-mode">new application</em></legend>
            <div id="appspec"></div>
          </fieldset>
          <fieldset class="pax-opt" id="pax-opt">
            <legend>Observation evidence</legend>
            <label class="field check"><input name="pax" id="pax-check" type="checkbox"> <span id="pax-label">Collect PAX observations after verification</span></label>
            <p class="muted" id="pax-hint"></p>
          </fieldset>
          <label class="field"><span>Deliver files to <em>optional folder</em></span><input name="outputDir" id="output-dir" placeholder="~/Projects/my-app  (a new or empty folder; leave blank to download from the run page)"></label>

          <details class="advanced">
            <summary>Factory settings</summary>
            <div class="settings">
              <label class="field"><span>Parallel agents</span><input name="maxParallel" type="number" min="1" max="8" value="3"></label>
              <label class="field"><span>Attempts per task</span><input name="maxAttempts" type="number" min="1" max="5" value="3"></label>
              <label class="field"><span>Token budget</span><input name="tokenBudget" type="number" min="10000" step="10000" value="2000000"></label>
              <label class="field check"><input name="deploy" type="checkbox" checked> <span id="deploy-label">Deploy a live preview</span></label>
              <label class="field wide" id="repo-field" hidden><span>Push result to repo (https)</span><input name="repoUrl" placeholder="https://github.com/you/new-app.git"></label>
            </div>
          </details>
          <section class="scope" id="run-scope" aria-labelledby="scope-title"><h3 id="scope-title">Before you start: what this run may do</h3><ul class="plain" id="scope-list"></ul></section>
          <p class="form-error" id="form-error" role="alert" hidden></p>
          <button class="primary" type="submit">Start the factory →</button>
        </form>

        <ol class="card layers-explainer" aria-label="How a run works">
          <li><b>Plan</b><span>A task graph with dependencies, risks and success criteria.</span></li>
          <li><b>Agents</b><span>Product, engineer, design, QA, DevOps, research — only those needed.</span></li>
          <li><b>Execution</b><span>Each agent gets only its task's context and real tools.</span></li>
          <li><b>Artifacts</b><span>Files, commands, logs and a summary for every task.</span></li>
          <li><b>Verification</b><span>The factory runs each task's checks before moving on.</span></li>
          <li><b>Feedback</b><span>Errors go back to the agent; 3 tries, then escalate. Lessons land in CLAUDE.md.</span></li>
          <li><b>Completion</b><span>Full tests, security review, live deploy, docs, final summary.</span></li>
        </ol>
      </div>
    </section>
  </template>

  <script src="app.js" type="module"></script>
</body>
</html>
